name: Deploy to Vercel

# Deploys the site to Vercel production on every push to main.
#
# Requires one repository secret:
#   VERCEL_TOKEN — create at https://vercel.com/account/tokens
#
# Until that secret exists this workflow skips cleanly (it will not fail
# your builds). Add the secret and the very next push deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  # Project identifiers — these are not secrets, they are safe to commit.
  VERCEL_ORG_ID: team_0kNtpCWQ8ekTHIXLrzB2KWen
  VERCEL_PROJECT_ID: prj_5N2vJIADHEpcHAtkDVGpR4yArIbY

jobs:
  deploy:
    name: Production deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check whether VERCEL_TOKEN is configured
        id: guard
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Vercel deploy skipped::Add a VERCEL_TOKEN repository secret (https://vercel.com/account/tokens) to enable automatic deploys."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy to Vercel (production)
        if: steps.guard.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
